    suggestions:
      - "Le ciel est bleu, oui. De quoi parles-tu ?"
      - "Je ne veux pas d'ennuis."
      - "[Annuler / Ignorer la transmission]"
    transitions:
      - intent: COMPLIANCE
        next_step: cooperate
      - intent: REFUSAL
        next_step: reject
      - intent: CANCEL
        next_step: reject
