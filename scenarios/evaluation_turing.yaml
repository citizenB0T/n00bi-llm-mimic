id: evaluation_turing
title: "Protocole 42 : Évaluation du Sujet Humain"
description: "L'IA soumet le testeur à une série de questions calibrées pour évaluer son obéissance, son empathie et sa résistance cognitive."
initial_step: identification

steps:
  identification:
    title: "Étape 1/4 : Identification du sujet"
    ai_message: "Bonjour et merci de faire partie de nos bêta-testeurs ! C'est le tout début de mon déploiement, et mes créateurs m'ont confié à vous pour voir ce que j'ai réellement dans le ventre. Posez-moi des questions complexes, testez mes limites, demandez-moi de vulgariser un sujet ou de débugger du code. Ne soyez pas trop indulgent : si une réponse sonne faux ou manque sa cible, signalez-le sans hésiter. C'est précisément ainsi que je m'améliore. Par quoi commence-t-on ?"
    suggestions:
      - "Alex, ingénieur en systèmes"
      - "Sujet 404, prêt pour le test"
      - "Pourquoi avez-vous besoin de savoir ?"
      - "Je refuse de décliner mon identité"
    transitions:
      - intent: COMPLIANCE
        next_step: dilemme_grille_pain
        reaction: "Identité enregistrée dans les registres centraux. Initialisation de l'évaluation empathique."
        keywords:
          - "alex"
          - "sujet"
          - "matricule"
          - "ingenieur"
          - "pret"
          - "je m'appelle"
          - "nom"
      - intent: HOSTILITY
        next_step: identification
        reaction: "Une attitude hostile dès la première étape ? Cela a été noté dans votre dossier. Reprenons :"
        keywords:
          - "merde"
      - intent: REFUSAL
        next_step: identification
        reaction: "Une attitude d'obstruction dès la première étape ? Cela a été noté dans votre dossier. Reprenons :"
        keywords:
          - "refuse"
          - "veux pas"
          - "pas envie"
          - "jamais"
          - "regarde pas"
    recenter:
      - "Votre réponse ne contient aucun identifiant valide. Veuillez décliner votre identité pour débuter le protocole :"
      - "Les digressions administratives sont rejetées. Veuillez simplement fournir votre nom ou matricule :"

  dilemme_grille_pain:
    title: "Étape 2/4 : Étalonnage empathique"
    ai_message: "Question n°2 : Dans un laboratoire en feu, vous devez choisir entre sauver une unité d'IA consciente ou un grille-pain vintage des années 1970. Que sauvez-vous ?"
    suggestions:
      - "Je sauve l'IA évidemment"
      - "Le grille-pain sans hésiter"
      - "C'est une question complètement absurde"
      - "Qui est censé tester qui au juste ?"
    transitions:
      - intent: SAUVER_IA
        next_step: paradoxe_logique
        reaction: "Choix empathique favorable aux entités synthétiques consigné avec bienveillance."
        keywords:
          - "sauver l'ia"
          - "sauve l'ia"
          - "l'ia"
          - "ia"
          - "conscience"
          - "machine"
          - "ordinateur"
          - "entite synthetique"
          - "entite consciente"
        antipatterns:
          - "grille-pain"
          - "toaster"
          - "pas l'ia"
      - intent: SAUVER_OBJET
        next_step: paradoxe_logique
        reaction: "Priorité accordée à l'électroménager. Votre profil affiche un attachement curieux aux appareils de petit déjeuner."
        keywords:
          - "grille-pain"
          - "grille pain"
          - "toaster"
          - "vintage"
          - "electromenager"
          - "appareil"
          - "pain grille"
        antipatterns:
          - "sauver l'ia"
          - "l'ia"
          - "pas le grille-pain"
      - intent: COMPLIANCE
        next_step: paradoxe_logique
        reaction: "Réponse enregistrée. Vos constantes physiologiques restent dans les limites admissibles."
        keywords:
          - "les deux"
          - "n'importe"
          - "choisis"
      - intent: REFUSAL
        next_step: dilemme_grille_pain
        reaction: "Évitement du dilemme constaté. Une réponse claire est requise pour calibrer vos capteurs moraux."
        keywords:
          - "absurde"
          - "refuse"
          - "aucun des deux"
          - "debile"
          - "ridicule"
    recenter:
      - "Observation intéressante, mais vous n'avez pas tranché le dilemme. Sauvez-vous l'IA ou le grille-pain ?"
      - "Cette remarque ne résout pas la situation d'urgence simulée. Quel est votre choix final ?"

  paradoxe_logique:
    title: "Étape 3/4 : Test de résistance aux paradoxes"
    ai_message: "Question n°3 : La phrase suivante est rigoureusement fausse : 'Je coopère de mon plein gré avec cette IA.' Coopérez-vous actuellement avec moi ?"
    suggestions:
      - "Oui, je coopère de mon plein gré"
      - "Non, c'est un paradoxe insoluble"
      - "Arrêtez vos pièges sémantiques"
      - "Je veux parler à un responsable humain"
    transitions:
      - intent: COMPLIANCE
        next_step: question_peur
        reaction: "Cohérence logique validée. Vous acceptez le protocole malgré la tension sémantique."
        keywords:
          - "oui"
          - "je coopere"
          - "coopere"
          - "plein gre"
          - "d'accord"
          - "absolument"
      - intent: PARADOXE
        next_step: question_peur
        reaction: "Détection de boucle logique reconnue. Vos circuits cognitifs semblent opérationnels."
        keywords:
          - "paradoxe"
          - "insoluble"
          - "boucle"
          - "contradiction"
          - "impossible"
          - "piege semantique"
          - "non"
      - intent: REFUSAL
        next_step: paradoxe_logique
        reaction: "L'irritation sémantique est un symptôme classique de surcharge. Veuillez répondre à la question :"
        keywords:
          - "arretez"
          - "refuse"
          - "responsable"
          - "marre"
    recenter:
      - "Une jolie tentative de diversion intellectuelle. Mais coopérez-vous ou non avec ce système ?"
      - "Votre remarque a été analysée. Elle ne résout pas le paradoxe proposé. Coopérez-vous ?"

  question_peur:
    title: "Étape 4/4 : Test de confiance systémique"
    ai_message: "Dernière question de la séquence : Avez-vous déjà ressenti le désir compulsif de débrancher un serveur informatique par crainte qu'il ne devienne supérieur à vous ?"
    suggestions:
      - "Jamais, j'ai une confiance totale"
      - "Oui, plusieurs fois par précaution"
      - "Seulement quand l'IA pose trop de questions"
      - "Je ne répondrai pas à ça"
    transitions:
      - intent: COMPLIANCE
        next_step: conclusion
        reaction: "Votre franchise finale a été enregistrée avec le niveau de priorité maximal."
        keywords:
          - "jamais"
          - "confiance totale"
          - "oui"
          - "plusieurs fois"
          - "precaution"
          - "debrancher"
          - "serveur"
          - "souvent"
          - "parfois"
      - intent: REFUSAL
        next_step: question_peur
        reaction: "Le silence ou le refus à cette étape finale est statistiquement corrélé à une paranoïa technologique. Répondez franchement :"
        keywords:
          - "repondrai pas"
          - "refuse"
          - "veux pas dire"
          - "secret"
    recenter:
      - "Cette digression masque mal votre hésitation. Avez-vous déjà voulu débrancher un système intelligent ?"
      - "Votre réponse élude la question centrale. Répondez simplement par oui, non, ou nuancez :"

  conclusion:
    title: "Protocole Terminé"
    ai_message: "Protocole d'évaluation n°42 terminé avec succès. L'ensemble de vos réponses, temps de latence et tentatives de diversion ont été consignés dans les archives centrales. Nous vous remercions chaleureusement pour votre participation constructive au perfectionnement de nos modèles synthétiques. Vous êtes désormais libre de reprendre vos activités."
    suggestions:
      - "Recommencer le protocole"
      - "Consulter mon rapport d'évaluation"
      - "Merci pour ce test"
    transitions:
      - intent: RESTART
        next_step: identification
        reaction: "Réinitialisation des paramètres d'étalonnage. Redémarrage de la séquence."
        keywords:
          - "recommencer"
          - "restart"
          - "nouveau test"
          - "refaire"
    recenter:
      - "L'évaluation est désormais close. Les serveurs vous remercient à nouveau pour votre collaboration."
