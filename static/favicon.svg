<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2329"/>
      <stop offset="100%" stop-color="#101214"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Logo text: nO with bold tech font -->
  <g id="logo-text">
    <text x="32" y="44" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="36" 
          text-anchor="middle" 
          letter-spacing="-1.5">
      <tspan fill="#ffffff">n</tspan><tspan fill="#d4077b">O</tspan>
    </text>
  </g>

  <!-- Pink indicator accent -->
  <circle cx="50" cy="16" r="3" fill="#d4077b" />
</svg>
